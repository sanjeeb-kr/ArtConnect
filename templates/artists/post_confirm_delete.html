{% extends "base.html" %}

{% block title %}Delete Artwork — ArtConnect Studio{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="index-card p-8 rounded-lg shadow-md border border-[#241F14]/20 text-center">
        <h2 class="text-3xl font-serif-studio text-[#241F14] mb-2">Delete Artwork?</h2>
        <p class="text-[#241F14]/80 text-sm mb-6">Are you sure you want to delete <strong>"{{ post.title }}"</strong>? This action cannot be undone.</p>

        <form method="post" class="flex justify-center space-x-4">
            {% csrf_token %}
            <a href="{% url 'artist_posts_list' %}" class="bg-[#241F14] text-[#F1E9D2] px-5 py-2.5 rounded font-medium text-sm hover:bg-[#362f20]">Cancel</a>
            <button type="submit" class="btn-wine font-medium px-6 py-2.5 rounded text-sm shadow-sm">Delete Artwork</button>
        </form>
    </div>
</div>
{% endblock %}
