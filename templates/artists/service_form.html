{% extends "base.html" %}

{% block title %}{{ title }} - ArtConnect{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 py-10">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100">
        <h2 class="text-3xl font-bold text-gray-900 mb-6">{{ title }}</h2>

        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Service Name *</label>
                {{ form.service_name }}
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Base Price (₹) *</label>
                    {{ form.price }}
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Pricing Note</label>
                    {{ form.pricing_note }}
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Package Details & Description</label>
                {{ form.description }}
            </div>

            <div class="flex justify-end space-x-4 pt-4">
                <a href="{% url 'artist_services_list' %}" class="bg-gray-100 text-gray-700 px-5 py-2.5 rounded-lg hover:bg-gray-200 transition font-medium">Cancel</a>
                <button type="submit" class="bg-indigo-600 text-white font-medium px-6 py-2.5 rounded-lg hover:bg-indigo-700 transition shadow">Save Service</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
