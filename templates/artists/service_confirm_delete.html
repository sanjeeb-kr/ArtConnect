{% extends "base.html" %}

{% block title %}Delete Service - ArtConnect{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="bg-white p-8 rounded-xl shadow-md border border-gray-100 text-center">
        <div class="w-12 h-12 rounded-full bg-red-100 text-red-600 flex items-center justify-center mx-auto mb-4">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Delete Service?</h2>
        <p class="text-gray-600 text-sm mb-6">Are you sure you want to delete <strong>"{{ service.service_name }}"</strong>? Clients will no longer see this package on your profile.</p>

        <form method="post" class="flex justify-center space-x-4">
            {% csrf_token %}
            <a href="{% url 'artist_services_list' %}" class="bg-gray-100 text-gray-700 px-5 py-2.5 rounded-lg hover:bg-gray-200 font-medium">Cancel</a>
            <button type="submit" class="bg-red-600 text-white font-medium px-6 py-2.5 rounded-lg hover:bg-red-700 shadow">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
