{% extends "base.html" %}

{% block title %}ArtConnect{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 py-12">
    <div class="index-card p-8 rounded-lg shadow-md border border-[#241F14]/20">
        <h2 class="text-3xl font-serif-studio text-[#241F14] mb-6">Edit Client Profile</h2>

        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-bold text-[#241F14] uppercase tracking-wider mb-1.5">First Name *</label>
                    <input type="text" name="first_name" value="{{ form.first_name.value|default:'' }}" required class="w-full px-4 py-2.5 bg-[#F1E9D2] border border-[#241F14]/30 rounded text-sm text-[#241F14] focus:outline-none focus:border-[#6E2A3A]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#241F14] uppercase tracking-wider mb-1.5">Last Name *</label>
                    <input type="text" name="last_name" value="{{ form.last_name.value|default:'' }}" required class="w-full px-4 py-2.5 bg-[#F1E9D2] border border-[#241F14]/30 rounded text-sm text-[#241F14] focus:outline-none focus:border-[#6E2A3A]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#241F14] uppercase tracking-wider mb-1.5">Email *</label>
                    <input type="email" name="email" value="{{ form.email.value|default:'' }}" required class="w-full px-4 py-2.5 bg-[#F1E9D2] border border-[#241F14]/30 rounded text-sm text-[#241F14] focus:outline-none focus:border-[#6E2A3A]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#241F14] uppercase tracking-wider mb-1.5">Phone Number</label>
                    <input type="tel" name="phone_number" value="{{ form.phone_number.value|default:'' }}" placeholder="+91 9876543210" class="w-full px-4 py-2.5 bg-[#F1E9D2] border border-[#241F14]/30 rounded text-sm text-[#241F14] focus:outline-none focus:border-[#6E2A3A]">
                    {% if form.phone_number.errors %}
                        <p class="text-xs text-[#6E2A3A] font-medium mt-1">{{ form.phone_number.errors.0 }}</p>
                    {% endif %}
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#241F14] uppercase tracking-wider mb-1.5">Location (City / Country)</label>
                    {{ form.location }}
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#241F14] uppercase tracking-wider mb-1.5">Profile Picture</label>
                    {{ form.profile_picture }}
                </div>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-[#241F14]/15">
                <a href="{% url 'client_dashboard' %}" class="bg-[#241F14] text-[#F1E9D2] px-5 py-2.5 rounded font-medium text-sm hover:bg-[#362f20]">Cancel</a>
                <button type="submit" class="btn-wine font-medium px-6 py-2.5 rounded text-sm shadow-sm">Save Client Profile</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
